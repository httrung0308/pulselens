services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pulselens
      POSTGRES_USER: pulselens
      POSTGRES_PASSWORD: pulselens
    ports:
      - "5432:5432"
    volumes:
      - pulselens-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulselens -d pulselens"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      PULSELENS_AI_MODE: mock
      PULSELENS_DATABASE_URL: postgresql+psycopg://pulselens:pulselens@postgres:5432/pulselens
      PULSELENS_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pulselens-postgres:
